<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Customer management System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="CSS/style.css">

    

</head>

<body>

    <div class="container mb-5">
        <h1 class="align text-center head p-7 underline-warning thickness-3">Customer Management System</h1>
        <table border="0" class="table table-borderless">
            <tr>
                <td>
                    <div class="card hover" style="max-width: 320px;">
                        <div class="card-body">
                            <h4 class="card-title head">Customer Form</h4>
                            <p class="card-subtitle fg-3">Enter customer details</p>
                            <input type="text" class="form-control" placeholder="Enter Name" id="name">
                            <input type="text" class="form-control" placeholder="Enter Address" id="address">
                            <input type="text" class="form-control" placeholder="Enter Email" id="email">
                            <input type="text" class="form-control" placeholder="Enter Phone" id="phone">
                            <button class="btn-solid theme-primary" id="addCustomer" onclick="addCustomerBtn()">Add
                                Customer</button>
                        </div>
                    </div>
                </td>
                <td>
                    <div class="card" style="max-width: 320px;">
                        <div class="card-body hover">
                            <h4 class="card-title head">Customer Table</h4>
                            <p class="card-subtitle fg-3 txt">List of customers</p>
                            <table class="table table-striped " id="customerTable">
                                <!-- <tr>
                                    <th>Name</th>
                                    <th>Address</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                </tr> -->
                            </table>

                        </div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="card hover" style="max-width: 320px;">
                        <div class="card-body">
                            <h4 class="card-title head">Item Form</h4>
                            <p class="card-subtitle fg-3 txt">Enter item details</p>
                            <input type="text" class="form-control" placeholder="Enter Item Name" id="itemName">
                            <input type="text" class="form-control" placeholder="Enter Price" id="itemPrice">
                            <input type="text" class="form-control" placeholder="Enter Quantity" id="itemQuantity">
                            <button class="btn-solid theme-primary" id="addItem" onclick="addItemBtn()">Add
                                Item</button>
                        </div>
                    </div>
                </td>
                <td>
                    <div class="card hover" style="max-width: 320px;">
                        <div class="card-body">
                            <h4 class="card-title head">Item Table</h4>
                            <p class="card-subtitle fg-3 txt">List of items</p>
                            <table class="table table-striped" id="itemTable">
                                <!-- <tr>
                                    <th>Item Name</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                </tr> -->
                            </table>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <script src="script.js"></script>
</body>

</html>
